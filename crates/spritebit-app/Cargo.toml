[package]
name = "spritebit-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17.2"
serde_json = "1.0.151"
spritebit-core = { version = "1.0.1", path = "../spritebit-core" }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe"] }
