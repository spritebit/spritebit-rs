# Release der Desktop-App — ganz ohne eigenen Server.
#
# Ein Tag wie `v1.1.0` pushen (git tag v1.1.0 && git push origin v1.1.0):
# GitHub baut und testet auf Windows und haengt die fertige Datei an eine
# Release. Die Startseite verlinkt
#   https://github.com/spritebit/spritebit-rs/releases/latest/download/spritebit-windows-x64.zip
# — das zeigt immer auf die neueste Version (Eintrag in js/site-links.js
# der Web-Version).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version pruefen (Tag = Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($cargo -ne $tag) { Write-Error "Tag v$tag passt nicht zu Cargo.toml ($cargo) - erst die Version in Cargo.toml anheben."; exit 1 }

      # Jede Version bringt ihre Notizen mit (notes/<version>.md, Abschnitte
      # „## Deutsch“ und „## English“): Text der Release und „Was ist neu?“
      # in der App (update.rs).
      - name: Notizen pruefen
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $f = "notes/$tag.md"
          if (-not (Test-Path $f)) { Write-Error "$f fehlt - erst die Notizen zu dieser Version schreiben."; exit 1 }
          if (-not (Select-String -Path $f -Pattern '^## Deutsch' -Quiet)) { Write-Error "$f hat keinen Abschnitt '## Deutsch'."; exit 1 }

      - name: Tests
        run: cargo test --workspace

      - name: Bauen
        run: cargo build --release -p spritebit-app

      - name: Packen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/spritebit | Out-Null
          Copy-Item target/release/spritebit-app.exe dist/spritebit/spritebit.exe
          Copy-Item LICENSE, README.md dist/spritebit/
          Compress-Archive -Path dist/spritebit/* -DestinationPath dist/spritebit-windows-x64.zip
          # Fuer „Jetzt aktualisieren“ in der App (selfupdate.rs): die .exe
          # einzeln und ihre SHA-256-Pruefsumme — die App laedt beides und
          # tauscht sich nur aus, wenn die Summe stimmt.
          Copy-Item dist/spritebit/spritebit.exe dist/spritebit.exe
          $h = (Get-FileHash dist/spritebit.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/spritebit.exe.sha256 -Value "$h  spritebit.exe" -NoNewline -Encoding ascii
          # „Was ist neu?“ im Update-Band laedt diese Datei (update.rs).
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if (Test-Path "notes/$v.md") { Copy-Item "notes/$v.md" dist/notes.md }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spritebit-windows-x64.zip
            dist/spritebit.exe
            dist/spritebit.exe.sha256
            dist/notes.md
          body_path: dist/notes.md
          generate_release_notes: true

      - name: Als Artefakt (manueller Lauf ohne Tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: spritebit-windows-x64
          path: dist/spritebit-windows-x64.zip
